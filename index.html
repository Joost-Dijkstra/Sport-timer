<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sporttimer Cool</title>
<meta name="theme-color" content="#0b132b" />
<meta name="description" content="Een nauwkeurige, installeerbare sporttimer met geluid, trilling en thema's." />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <div class="brand">
      <img class="brand-logo" src="logo-sporttimer-cool.svg" alt="Sporttimer Cool logo" />
      <div class="brand-text">
        <div class="brand-title">SPORTTIMER</div>
        <div class="brand-sub">Cool Edition</div>
      </div>
    </div>
    <div class="strap top" aria-hidden="true"></div>

    <div class="watch-shell">
      <span class="side-button top" aria-hidden="true"></span>
      <span class="side-button bottom" aria-hidden="true"></span>

      <div class="timer-wrap">
        <div class="ring-glow" aria-hidden="true"></div>
        <svg class="tech-ring" viewBox="0 0 362 362" aria-hidden="true">
          <defs>
            <filter id="boundaryGlow" x="-250%" y="-250%" width="600%" height="600%">
              <feGaussianBlur stdDeviation="3.2"/>
            </filter>
          </defs>
          <circle cx="181" cy="181" r="148" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="22"/>
          <circle cx="181" cy="181" r="148" fill="none" stroke="rgba(255,255,255,.11)" stroke-width="8"/>
          <circle id="ringRemaining" cx="181" cy="181" r="148" fill="none"
                  stroke="#ff8c00" stroke-width="13"
                  transform="rotate(-90 181 181)"/>
          <circle id="ringElapsed" cx="181" cy="181" r="148" fill="none"
                  stroke="#008cff" stroke-width="13" stroke-linecap="butt"
                  stroke-dasharray="929.91" stroke-dashoffset="0"
                  transform="rotate(-90 181 181)"/>
          <circle id="progressHeadGlow" cx="181" cy="33" r="8" fill="#53b4ff" opacity="0" filter="url(#boundaryGlow)"/>
          <circle id="progressHead" cx="181" cy="33" r="4" fill="#8fd2ff" opacity="0"/>
        </svg>

        <div class="center-core">
          <div class="time" id="timerText" role="timer" aria-label="Resterende tijd">90</div>
          <div class="inner-controls">
            <button class="circle-btn" id="pauseBtn" type="button" aria-label="Timer starten">&#9654;</button>
            <button class="circle-btn stop" id="stopBtn" type="button" aria-label="Timer stoppen">&#9632;</button>
          </div>
        </div>
      </div>
    </div>

    <div class="strap bottom" aria-hidden="true"></div>

    <div class="presets">
      <button class="preset" id="btn1" type="button">90s</button>
      <button class="preset" id="btn2" type="button">60s</button>
      <button class="rest-btn" id="restBtn" type="button">30s</button>
    </div>

    <div class="toolbar">
      <button class="gear" id="settingsBtn" type="button" aria-label="Open instellingen">&#9881;</button>
    </div>

    <div class="footer">
      <span>Sporttimer Cool</span>
      <span class="wake-status" id="wakeStatus">Schermbeveiliging controleren...</span>
    </div>
    <div class="sr-only" id="statusText" aria-live="polite"></div>
  </div>

  <div class="overlay" id="overlay" hidden>
    <form class="card" id="settingsDialog" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" tabindex="-1">
      <h2 id="settingsTitle">Instellingen</h2>
      <div class="row"><label for="time1input">Timer 1</label><input id="time1input" type="number" min="1" max="3600" step="1"></div>
      <div class="row"><label for="time2input">Timer 2</label><input id="time2input" type="number" min="1" max="3600" step="1"></div>
      <div class="row"><label for="restInput">Rusttimer</label><input id="restInput" type="number" min="1" max="3600" step="1"></div>
      <div class="row">
        <label for="themeSelect">Thema</label>
        <select id="themeSelect">
          <option value="neon">Neon Race</option>
          <option value="arctic">Arctic Pulse</option>
          <option value="lava">Lava Forge</option>
        </select>
      </div>
      <div class="row">
        <label for="alarmSelect">Alarm</label>
        <select id="alarmSelect">
          <option value="1">1 signaal</option>
          <option value="2">2 signalen</option>
          <option value="3">3 signalen</option>
          <option value="4">4 signalen</option>
          <option value="5">5 signalen</option>
          <option value="8">8 signalen</option>
          <option value="10">10 signalen</option>
        </select>
      </div>
      <div class="row">
        <label for="toneSelect">Alarmtoon</label>
        <select id="toneSelect">
          <option value="beep">Korte piep</option>
          <option value="double">Dubbele piep</option>
          <option value="chirp">Hoge chirp</option>
          <option value="bell">Zachte bel</option>
          <option value="chime">Heldere chime</option>
          <option value="siren">Sportsirene</option>
          <option value="stadium">Stadionhoorn</option>
          <option value="gong">Diepe gong</option>
        </select>
      </div>
      <div class="row">
        <label for="volumeInput">Volume</label>
        <div class="volume-wrap">
          <input id="volumeInput" type="range" min="0" max="150" step="5" value="100">
          <output id="volumeValue" for="volumeInput">100%</output>
        </div>
      </div>
      <div class="row">
        <label for="tempoSelect">Alarmtempo</label>
        <select id="tempoSelect">
          <option value="fast">Snel</option>
          <option value="normal">Normaal</option>
          <option value="slow">Rustig</option>
        </select>
      </div>
      <div class="row">
        <label for="lengthSelect">Toonlengte</label>
        <select id="lengthSelect">
          <option value="short">Kort</option>
          <option value="normal">Normaal</option>
          <option value="long">Lang</option>
        </select>
      </div>
      <div class="row"><label for="soundToggle">Geluid</label><input id="soundToggle" class="switch" type="checkbox"></div>
      <div class="row"><label for="vibrateToggle">Trillen</label><input id="vibrateToggle" class="switch" type="checkbox"></div>
      <div class="row"><label for="cuesToggle">Start- en sprintcues</label><input id="cuesToggle" class="switch" type="checkbox"></div>
      <div class="row"><label for="wakeToggle">Scherm aanhouden</label><input id="wakeToggle" class="switch" type="checkbox"></div>
      <button class="preview-btn" id="previewBtn" type="button">Test wekker</button>
      <button class="save-btn" type="submit">Opslaan</button>
      <button class="close-btn" id="closeSettingsBtn" type="button">Sluiten</button>
    </form>
  </div>

<script src="./timer-core.js" defer></script>
<script src="./app.js" defer></script>
</body>
</html>
